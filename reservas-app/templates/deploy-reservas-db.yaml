apiVersion: apps/v1
kind: Deployment
metadata:
  name: reservas-db
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.db.replicas }}
  selector:
    matchLabels:
      app: reservas-db
  template:
    metadata:
      labels:
        app: reservas-db
    spec:
      containers:
        - name: reservas-db
          image: "{{ .Values.db.image.repository }}:{{ .Values.db.image.tag }}"
          ports:
            - containerPort: {{ .Values.db.port }}
          envFrom:
            - secretRef:
                name: reservas-db-secret
          env:
            - name: MYSQL_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: reservas-api-config
                  key: DB_NAME
          volumeMounts:
            - name: datos
              mountPath: /var/lib/mysql
              subPath: mysql
      volumes:
        - name: datos
          persistentVolumeClaim:
            claimName: reservas-db-pvc
