apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: reservas-app-ingress
  namespace: {{ .Values.namespace }}
spec:
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: reservas-frontend
                port:
                  number: {{ .Values.frontend.port }}
