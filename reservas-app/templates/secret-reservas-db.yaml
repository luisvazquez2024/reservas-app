apiVersion: v1
kind: Secret
metadata:
  name: reservas-db-secret
  namespace: {{ .Values.namespace }}
type: Opaque
stringData:
  MYSQL_USER: {{ .Values.db.secret.mysqlUser | quote }}
  MYSQL_PASSWORD: {{ .Values.db.secret.mysqlPassword | quote }}
  MYSQL_ROOT_PASSWORD: {{ .Values.db.secret.mysqlRootPassword | quote }}
