apiVersion: v1
kind: Pod
metadata:
  name: reservas-frontend
  labels:
    app: reservas-frontend
spec:
  containers:
  - name: reservas-frontend
    image: luisv3k/reservas-frontend:v1
    ports:
    - containerPort: 8080
    env:
    - name: API_HOST
      value: "reservas-api"
    - name: API_PORT
      value: "3000"