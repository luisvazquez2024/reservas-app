version: '3.8'

networks:
  reservas-net:
    name: reservas-net

volumes:
  reservas-db-data:
    name: reservas-db-data

services:
  reservas-db:
    image: mysql:8.4
    container_name: reservas-db
    networks:
      - reservas-net
    volumes:
      - reservas-db-data:/var/lib/mysql
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-reservasdb}
      MYSQL_USER: ${MYSQL_USER:-reservas_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-reservas_pass}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-reservas_root_pass}
    # Principio de mínimo privilegio: capabilities estrictamente necesarias para MySQL
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - FOWNER
      - SETGID
      - SETUID
      - DAC_OVERRIDE
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 40s

  reservas-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: reservas-api:v1
    container_name: reservas-api
    networks:
      - reservas-net
    ports:
      - "3001:3000"
    environment:
      PORT: 3000
      DB_HOST: reservas-db
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-reservasdb}
      DB_USER: ${MYSQL_USER:-reservas_user}
      DB_PASSWORD: ${MYSQL_PASSWORD:-reservas_pass}
      APP_VERSION: v1
      SEED_DEMO: "true"
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      reservas-db:
        condition: service_healthy

  reservas-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: reservas-frontend:v1
    container_name: reservas-frontend
    networks:
      - reservas-net
    ports:
      - "3000:8080"
    environment:
      API_HOST: reservas-api
      API_PORT: 3000
      NGINX_ENVSUBST_FILTER: API_
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 3
    depends_on:
      reservas-api:
        condition: service_healthy